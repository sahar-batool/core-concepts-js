///another example

const AccountBook =(function(){
    const recods = []
    let accessLog = []

    function logAccess(action){
        accessLog.push(`[${new Date().toISOString().slice(0, 10)}] - ${action}`)
    }
    function store(doc){
        logAccess(`Stored: ${doc}`)
    }
    function retrive(index){
        logAccess(`Retrived index ${index}`)
        return recods[index] || "not found"
    }
    function getRecodsCount(){
        return recods.length
    }
    function getAccessLog(){
        return accessLog.slice()
    }

    return {
        store,
        retrive,
        count:getRecodsCount,
        log:getAccessLog
    }
   
})()

AccountBook.store("sugar 10kg")
AccountBook.store("rice 5kg")

console.log("sharma ji retrive: ", AccountBook.retrive(0))
console.log("sharma ji count: ", AccountBook.count)
console.log("log length: ", AccountBook.log().length)
console.log("log length: ", typeof AccountBook.logAccess)
