<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promises, callbacks,</title>
</head>
<body>
    <script>
        //promise one
    const promiseOne = new Promise(function(resolve, reject){
        setTimeout(function(){
        resolve({username: "chai", email: "chai@example.com"})
        }, 1000)

    }) //resolve direct relation .then
    promiseOne.then(function(user){
        console.log(user)
    })

//promise two
const promiseTwo = new Promise(function(resolve, reject){
    setTimeout(function(){
        let error = false
        if(!error){
            resolve({username: "hitesh", psasword: 143})
        }else{
            reject('promise two become reject.')
        }
    }, 1000)
})
promiseTwo.then((user) => {
console.log(user)
return user.username
}).then((username) =>{
    console.log(username)
}).catch((error) => {
    console.log(error)
}).finally(() => console.log("promises either resolve or reject."))
    </script>
</body>
</html>
